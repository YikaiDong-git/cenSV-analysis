[workspace]
authors = ["josh.weinstock@emory.edu <Josh Weinstock>", "yikai.dong@emory.edu <Yikai Dong>"]
channels = ["conda-forge", "bioconda"]
name = "hprc"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
snakemake-cluster = { cmd = "snakemake --snakefile workflow/Snakefile --profile workflow/profiles/slurm", env = { PULP_CBC_CMD = ".pixi/envs/default/bin/cbc" } }
snakemake-local = { cmd = "snakemake --snakefile workflow/Snakefile --cores 2", env = { PULP_CBC_CMD = ".pixi/envs/default/bin/cbc" } }

[dependencies]
minimap2 = ">=2.30,<3"
samtools = ">=1.22.1,<2"
snakemake = ">=9.13.7,<10"
sniffles = ">=2.7.1,<3"
awscli = ">=2.32.5,<3"
snakemake-executor-plugin-cluster-generic = ">=1.0.9,<2"
coin-or-cbc = "*" # ILP solver

# haplogroup analysis
python = ">=3.8"
numpy = ">=1.20"
pandas = ">=1.3"
scipy = ">=1.7"
scikit-learn = ">=1.0"
matplotlib = ">=3.4"
seaborn = ">=0.11"
adjusttext = ">=0.8"
cyvcf2 = ">=0.30"
tabix = "*"
pysam = ">=0.19"
scikit-bio = "*" # NJ clustering


# dipcall
dipcall = "*"
bedtools = ">=2.30"
bcftools = ">=1.15"

# svim-asm
# svim-asm = ">=1.0.3" use our adjusted version
python-edlib = "*"

truvari = ">=5.4.0,<6" # remove duplicate mutation from strvariant caller

# short read sequencing
#gsutil = ">=5.35,<6"

# Elastic Net training
joblib = ">=1.1"
tectonic = ">=0.15.0,<0.16"
texlive-core = ">=20230313,<20230314"
perl = ">=5.32.1,<5.33"
pymupdf = ">=1.26.1,<2"
cairosvg = ">=2.9.0,<3"
nodejs = ">=25.2.1,<25.3"
pyliftover = ">=0.4.1,<0.5"
venn = ">=0.1.3,<0.2"
python-pptx = ">=1.0.2,<2"
snakemake-executor-plugin-slurm = ">=1.4.0,<2"
bioconductor-qvalue = ">=2.42.0,<3"
rpy2 = ">=3.6.7,<4"
biopython = ">=1.87,<2"
matplotlib-venn = ">=1.1.2,<2"

[feature.hmm.dependencies]
beagle = { channel = "bioconda" }

[environments]
hmm = ["hmm"]

