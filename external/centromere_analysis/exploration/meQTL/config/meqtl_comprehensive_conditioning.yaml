analysis_stage: production_phase1_comprehensive_cis_conditioning
workflow_output: results/meqtl_cis/chm13_observed_sv_same_chrom/snp_conditioning_pc10_comprehensive
hierarchical_discoveries: results/meqtl_hierarchical_pc_sensitivity/summary/pc10/hierarchical_discoveries.tsv.gz
global_pair_discoveries: results/meqtl_hierarchical_pc_sensitivity/summary/pc10/global_pair_discoveries.tsv.gz
job_manifest: results/meqtl_cis/chm13_observed_sv_same_chrom/manifests/job_manifest.tsv
matrix_dir: results/meqtl_cis/chm13_native_same_chrom/matrices
canonical_design: results/meqtl_hierarchical_pc_sensitivity/shared/canonical_pc_design.npz
python_cmd: uv run python
rscript_cmd: pixi run Rscript

expected:
  pairs: 972
  features: 927
  svs: 52
  hierarchical_primary: 870
  global_only_secondary: 102

panels:
  ont_source_locus:
    interpretation: same-participant sensitivity callset; not independent replication
    vcf_template: results/observed_sv_genotyping/pc30_q001_tags/chm13_snp_panel/merged/{chrom}.vcf.gz
    coverage_template: results/observed_sv_genotyping/pc30_q001_tags/chm13_snp_panel/regions/{chrom}.bed
    available_windows_bp: [1000000, 5000000]
    unavailable_reason: upstream ONT PMDV VCF objects are deleted; no retained full local VCF was found for 10/20-Mb extension
  joint_chm13_source_locus:
    interpretation: same-participant sensitivity callset; not independent replication
    vcf_template: results/meqtl_cis/chm13_observed_sv_same_chrom/snp_conditioning_pc10_comprehensive/panel_preparation/joint_chm13/vcf/{chrom}.vcf.gz
    coverage_template: results/meqtl_cis/chm13_observed_sv_same_chrom/snp_conditioning_pc10_comprehensive/panel_preparation/regions/{chrom}.bed
    available_windows_bp: [1000000, 5000000, 10000000, 20000000]
    unavailable_reason: ''

panel_preparation:
  output_dir: results/meqtl_cis/chm13_observed_sv_same_chrom/snp_conditioning_pc10_comprehensive/panel_preparation
  samples: results/meqtl_cis/chm13_observed_sv_same_chrom/manifests/overlap_samples.txt
  max_window_bp: 20000000
  ont_s3_listing: ${CENSV_LAB}/shared/1KG_ONT/precalled_methylation/manifests/chm13_napu_chm13_s3_ls.txt
  ont_base_url: https://1000g-ont.s3.amazonaws.com
  joint_remote_vcf_template: https://human-pangenomics.s3.us-west-2.amazonaws.com/T2T/CHM13/assemblies/variants/1000_Genomes_Project/chm13v2.0/unrelated_samples_2504/1KGP.CHM13v2.0.{chrom}.recalibrated.snp_indel.pass.unrel.vcf.gz
  storage_projection_baseline_regions: results/meqtl_cis/chm13_observed_sv_same_chrom/chm13_joint_snp_panel/regions
  storage_projection_baseline_vcfs: results/meqtl_cis/chm13_observed_sv_same_chrom/chm13_joint_snp_panel/vcf
  storage_safety_factor: 2.0
  storage_cap_bytes: 100000000000
  bcftools: bcftools
  threads: 2
  mem_mb: 12000
  runtime: 480

windows_bp: [1000000, 5000000, 10000000, 20000000]
outcome_batch_size: 10
min_complete_samples: 112
maf_min: 0.01
min_site_call_rate: 0.8
min_dp: 5
min_gq: 5
max_raw_snps: 250000
max_susie_snps: 1000
max_condition_snps: 40
condition_ld_r2_max: 0.8
ridge_folds: 5
random_seed: 104729
robustness:
  susie_sv_pip_min: 0.9
  bh_q_max: 0.05
  minimum_supported_windows: 2

threads_extract: 1
mem_mb_extract: 12000
runtime_extract: 240
threads_analysis: 1
mem_mb_analysis: 20000
runtime_analysis: 240
mem_mb_summary: 24000
runtime_summary: 120
