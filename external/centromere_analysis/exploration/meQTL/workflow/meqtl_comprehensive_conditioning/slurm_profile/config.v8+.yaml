executor: cluster-generic
jobs: 100
local-cores: 1
default-resources:
  - mem_mb=8000
  - runtime=120
cluster-generic-cancel-cmd: scancel
max-jobs-per-second: 5
max-status-checks-per-second: 1
restart-times: 1
keep-going: true
rerun-incomplete: true
latency-wait: 60
printshellcmds: true
use-conda: false
cluster-generic-submit-cmd: >-
  sbatch --parsable
  --nodes=1
  --ntasks=1
  --cpus-per-task={threads}
  --mem={resources.mem_mb}M
  --time={resources.runtime}
  --nodelist=node03,node04,node05
  -J meqtl.cc.{rule}.{jobid}
  -o $MEQTL_SLURM_LOG_DIR/%x.%j.out
  -e $MEQTL_SLURM_LOG_DIR/%x.%j.err
